# basic.conf
# minimal valid configuration.
#
# telos: smallest config satisfying every mandatory validator constraint.
# 1 server block, 1 listen address, 1 location with a root.
#
# what this tests:
# . server block open/close
# . listen directive — bare port, no host → parser assigns "0.0.0.0"
# . location block open/close
# . root directive
# . all mandatory fields present → validator passes
#
# what this deliberately omits (each gets its own test config):
# . server_name          optional — defaults to empty / catch-all
# . index                optional — no index file resolution
# . error_page           optional — server returns raw 404/500
# . allowed_methods      optional — parser defaults to {GET, POST, DELETE}
# . client_max_body_size optional — parser applies 1M default
# . autoindex            optional — defaults to off

server {
    listen 8080;

    location / {
        root /var/www/html;
    }
}

# port: 8080
# 80 requires root privileges, which breaks on unprivileged test runner
# 8080 is canonical unprivileged alternative for HTTP

## host: omit (bare port)
## parser assigns default 0.0.0.0. this tests that default assignment path explicitly

## root: a real-looking but obviously local path
## /var/www/html is the established convention.

## location path: / 
## the catch-all, the one every implementation must handle