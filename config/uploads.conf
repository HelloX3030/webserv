# uploads.conf
# file upload scenario: client POSTs a file; server saves it to disk.
#
# telos: demonstrate that the server can receive a request body and persist
# it as a file, without executing it. this is data ingestion, not dynamic
# content. the two upload directives are webserv-specific — not from nginx.
#
# what this demonstrates:
# . upload_enable        on — activates upload handling in this location
# . upload_store         path where the server writes received files
# . allowed_methods      POST required; GET included to retrieve the form
# . client_max_body_size raised to 10m — a POST body carrying a file is
#                        legitimately large; the default 1m would reject it
#
# what this deliberately omits:
# . cgi           separate scenario (cgi.conf)
# . error_page    raw defaults sufficient for this scenario
# . server_name   single virtual host, not the routing concern here
# . autoindex     not relevant — upload_store is a write-only target
#
# path dependencies:
# . www/html/upload.html    an HTML form that POSTs to /upload/
# . www/uploads/            directory the server writes received files into
#                           must exist and be writable before the server starts
#
# minimal upload.html to verify upload handling:
#   <form method="POST" action="/upload/" enctype="multipart/form-data">
#     <input type="file" name="file">
#     <button type="submit">upload</button>
#   </form>
#
# to test:
#   curl -X POST -F "file=@/path/to/testfile.txt" http://127.0.0.1:8080/upload/
#   ls www/uploads/

server {
    listen 127.0.0.1:8080;
    server_name localhost;

    client_max_body_size 10m;

    location / {
        root ./www/html;
        index upload.html;
        allowed_methods GET;
    }

    location /upload/ {
        root ./www/uploads;
        allowed_methods GET POST;
        upload_enable on;
        upload_store ./www/uploads;
    }
}

# client_max_body_size: 10m (server-level)
# the default (1m) is correct for HTML pages. it is insufficient for file
# uploads. a file upload form commonly submits files in the range of 1–100 MB.
# 10m is a reasonable demonstration value: large enough to accept real files
# during eval, small enough to remain safe against naive stress testing.
# stated at server level so it applies to all locations — the upload location
# inherits it without needing to restate it.

# location /:
# serves the HTML upload form to the browser.
# GET only: a form page has no legitimate POST or DELETE use.
# index upload.html: GET / resolves to www/html/upload.html — the entry point
# for a human evaluator who opens a browser rather than using curl.

# location /upload/:
# the POST target of the form's action attribute.
# this is the location that activates the upload machinery.
# prefix /upload/ is chosen for clarity — it names the operation, not the
# storage path. the two are deliberately decoupled: URI space ≠ filesystem.

# root ./www/uploads:
# the root here allows GET /upload/<filename> to retrieve a previously
# uploaded file directly. this makes the scenario self-verifiable without
# external tooling: upload a file, then GET it back from the same location.
# root and upload_store point to the same directory by design here —
# there is no contradiction. root governs GET resolution;
# upload_store governs where POST bodies are written.

# allowed_methods GET POST:
# POST: the client submits a file body; the server writes it to upload_store.
# GET:  the client retrieves a previously saved file by name.
# DELETE excluded: no deletion scenario in this config file.

# upload_enable on:
# the flag that activates upload handling in this location.
# without it, a POST body would be read and discarded (or rejected).
# with it, the server's request handler takes the body and writes it to disk.
# this is a webserv-specific directive — nginx uses different mechanisms.

# upload_store ./www/uploads:
# the filesystem directory where uploaded files are written.
# path is relative, resolved to absolute at parse time via getcwd().
# the directory must exist before the server starts — the server does not
# create it. a missing directory is a configuration error, not a runtime error.
# the server writes received bytes directly to a file in this directory.
# filename: extracted from the Content-Disposition: filename= parameter of
# the multipart request header. sanitised via basename() before writing —
# all directory components stripped. a hostile filename such as
# ../../etc/cron.d/evil is reduced to the flat string evil before the
# file descriptor is opened. the server never creates subdirectories.