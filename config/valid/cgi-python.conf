# CGI: dynamic content via external subprocess.
#
# demonstrate that the server can execute a program and return its
# stdout as the HTTP response, rather than serving a static file.
#
# what this demonstrates:
# . cgi_extension   file extension that triggers CGI execution
# . cgi_path        interpreter binary the server invokes
# . location /cgi-bin/ scoped to a dedicated prefix — standard convention
# . allowed_methods GET POST — CGI scripts may need to read a request body
#
# what this deliberately omits:
# . error_page      raw defaults sufficient for this scenario
# . upload          separate scenario (uploads.conf)
# . client_max_body_size  inherits parser default (1m)
#
# path dependencies:
# . www/cgi-bin/          directory must exist
# . www/cgi-bin/hello.py  a minimal CGI script must exist here (see below)
#
# minimal hello.py to verify CGI execution:
#   #!/usr/bin/env python3
#   print("Content-Type: text/plain\r")
#   print("\r")
#   print("hello from CGI")
#
# to test:
#   curl http://127.0.0.1:8080/cgi-bin/hello.py

server {
    listen 127.0.0.1:8080;
    server_name localhost;

    location /cgi-bin/ {
        root ./www;
        cgi_extension .py;
        cgi_path /usr/bin/python3;
        allowed_methods GET POST;
    }
}

# location /cgi-bin/:
# all URIs beginning with /cgi-bin/ are handled here.
# this is the universal convention — CGI scripts live under /cgi-bin/.
# a request for /cgi-bin/hello.py resolves to: root + URI
# → ./www/cgi-bin/hello.py on disk.

# root ./www (not ./www/html):
# URI /cgi-bin/hello.py → filesystem path ./www/cgi-bin/hello.py.
# if root were ./www/html, the path would be ./www/html/cgi-bin/hello.py —
# wrong directory. root must be the parent of cgi-bin/, not inside it.

# cgi_extension .py:
# when the server resolves a request to a file ending in .py,
# it does not serve the file — it executes it.
# the extension is the trigger. the file's content is code, not data.

# cgi_path /usr/bin/python3:
# the interpreter binary the server passes to execve().
# the server forks a child process, sets environment variables
# (REQUEST_METHOD, CONTENT_LENGTH, QUERY_STRING etc.), and executes:
#   /usr/bin/python3 ./www/cgi-bin/hello.py
# the child's stdout is piped back to the server and becomes the response body.
# the server never blocks waiting — it registers the pipe fd with poll()
# and reads as data becomes available.

# allowed_methods GET POST:
# GET: query parameters passed via QUERY_STRING env var.
# POST: request body passed to CGI stdin.
# DELETE excluded: no standard CGI use case for it here.