server {
        listen 127.0.0.1:8080;
        server_name localhost;

        # Test-only config: uses temporary roots that tests create/delete.

        location /auto_on/ {
                root ./www/full/itest_autoindex_on;
                autoindex on;
                allowed_methods GET;
        }

        location /auto_off/ {
                root ./www/full/itest_autoindex_off;
                autoindex off;
                allowed_methods GET;
        }

        location /auto_off_index/ {
                root ./www/full/itest_autoindex_off_index;
                index index.html;
                autoindex off;
                allowed_methods GET;
        }
}
