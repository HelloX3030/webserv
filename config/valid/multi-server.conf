# multi-server.conf
# virtual hosting: 2 server blocks on 1 port, differentiated by server_name.
#
# telos: demonstrate that 1 listening socket serves multiple distinct virtual
# hosts, selected at request time by matching the HTTP Host header against
# each server block's server_name list.
#
# what this demonstrates:
# . 2 server blocks sharing a single port
# . server_name routing — Host header selects which block handles the request
# . first-defined fallback — no Host match → first block wins (nginx convention)
# . each virtual host has an independent location tree
# . config-specific web roots under www/multi-server/
#
# what this deliberately omits:
# . error_page    each block inherits raw default error responses
# . cgi           separate scenario (cgi.conf)
# . uploads       separate scenario (uploads.conf)
#
# path dependencies:
# . www/multi-server/alpha/index.html
# . www/multi-server/beta/index.html
#
# to test routing manually:
#   curl -H "Host: alpha.localhost" http://127.0.0.1:8080/
#   curl -H "Host: beta.localhost"  http://127.0.0.1:8080/
#   curl -H "Host: unknown"         http://127.0.0.1:8080/   ← falls to alpha

server {
    listen 127.0.0.1:8080;
    server_name alpha.localhost;

    location / {
        root ./www/multi-server/alpha;
        index index.html;
        allowed_methods GET;
        autoindex off;
    }
}

server {
    listen 127.0.0.1:8080;
    server_name beta.localhost;

    location / {
        root ./www/multi-server/beta;
        index index.html;
        allowed_methods GET;
        autoindex on;
    }
}

# duplicate listen address:
# both blocks bind to 127.0.0.1:8080. the grammar permits this — it is the
# mechanism of virtual hosting. at runtime ONE listening socket is created for
# 127.0.0.1:8080. the fd maps to both server blocks. the routing step
# (Server::route_request) resolves which block handles each connection by
# comparing the incoming request's Host header against server_names.

# server_name routing:
# Host: alpha.localhost → first block
# Host: beta.localhost  → second block
# Host: <anything else> → first block (first-defined fallback, nginx convention)
# NOTE: first-defined fallback is decided — adopted from nginx behaviour.
# no Host match → runtime selects first server block defined on that port.
# config parser unaffected — parser stores ServerConfig objects in parse order;
# runtime reads that order when selecting the fallback.

# roots:
# alpha and beta are isolated filesystem roots under www/multi-server/.
# this makes Host-based routing observable immediately in the response body.
