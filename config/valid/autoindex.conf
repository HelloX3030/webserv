server {
        listen 127.0.0.1:8080;
        server_name localhost;

        # Default landing page for this demo config
        location / {
                root ./www/autoindex;
                index index.html;
                allowed_methods GET;
        }

        # autoindex enabled: directory without index -> HTML listing
        location /auto_on/ {
                root ./www/autoindex/demo_on;
                autoindex on;
                allowed_methods GET;
        }

        # autoindex disabled: directory without index -> 403
        location /auto_off/ {
                root ./www/autoindex/demo_off;
                autoindex off;
                allowed_methods GET;
        }

        # autoindex disabled but index exists: index wins
        location /auto_off_index/ {
                root ./www/autoindex/demo_off_index;
                index index.html;
                autoindex off;
                allowed_methods GET;
        }
}
