server {
    listen 127.0.0.1:8080;
    server_name localhost;

    location / {
        root ./www/redirect;
        return 301 /new/;
    }

    location /old {
        root ./www/redirect;
        return 301 /new/;
    }

    location /old/ {
        root ./www/redirect;
        return 301 /new/;
    }

    location /new {
        root ./www/redirect;
        return 301 /new/;
    }

    location /new/ {
        root ./www/redirect;
        index index.html;
        allowed_methods GET;
    }
}
