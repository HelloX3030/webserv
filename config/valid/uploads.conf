server {
    listen 127.0.0.1:8080;
    server_name localhost;

    client_max_body_size 10m;

    location / {
        root ./www/uploads;
        index upload.html;
        allowed_methods GET;
    }

    location /upload/ {
        root ./www/uploads/files;
        allowed_methods GET POST;
        upload_enable on;
        upload_store ./www/uploads/files;
    }
}
