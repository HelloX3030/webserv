# runnable default configuration.
# loaded when the binary is invoked with no argument: ./webserv
# must start, serve a page, and handle errors with zero setup beyond cloning
# the repo.
#
# what this demonstrates:
# . listen             host:port form — explicit interface binding
# . server_name        canonical hostname for this virtual host
# . client_max_body_size server-level default, applies to all locations
# . error_page         custom 404 and 500 pages served from www/
# . root               relative path, resolved to absolute at parse time
# . index              file resolved when URI ends in /
# . allowed_methods    explicit restriction — GET only on static content

server {
    listen 127.0.0.1:8080;
    server_name localhost;

    client_max_body_size 1m;

    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    location / {
        root ./www/html;
        index index.html;
        allowed_methods GET;
    }
}

# listen: 127.0.0.1:8080
# host:port form exercises the full host_port grammar production.
# 127.0.0.1 binds only to loopback — correct for local eval, no firewall issues.
# 8080: unprivileged port, no root required.

# server_name: localhost
# matches the Host header a browser sends to 127.0.0.1:8080.
# establishes the virtual host identity without requiring DNS.

# client_max_body_size: 1m
# server-level directive. sets the upper bound on request body size for all
# locations in this block. 1m is the parser's own default — stated explicitly
# here to demonstrate the directive is parsed and applied, not merely inherited.

# error_page: 404, 500
# paths are URI-space, not filesystem paths.
# the server resolves /errors/404.html against location root at request time.
# both files exist in www/html/errors/ — no missing-file risk during eval.

# location /:
# catch-all. every URI that matches no more specific prefix falls here.

# root: ./www/html
# relative path. parser resolves via getcwd() at parse time → absolute.
# binary must be launched from repo root: ./webserv
# not: cd build && ./webserv

# index: index.html
# GET / → server appends index.html → serves www/html/index.html.
# file exists in the repo.

# allowed_methods: GET
# static file serving has no legitimate use for POST or DELETE.
# explicit restriction: any other method → 405 Method Not Allowed.
# also exercises the methods_dir grammar production with a non-default value.
