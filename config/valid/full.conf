# full.conf
# Integrated demo config: static site + redirect + uploads + cookies + CGI (bash/python)
# + virtual host routing.

server {
    listen 127.0.0.1:8080;
    server_name localhost alpha.localhost;

    client_max_body_size 10m;

    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    # Landing page
    location / {
        root ./www/full/site;
        index index.html;
        allowed_methods GET;
    }

    # Redirect demo
    location /old {
        root ./www/full/site;
        return 301 /blog/;
    }

    location /old/ {
        root ./www/full/site;
        return 301 /blog/;
    }

    # Blog page
    location /blog/ {
        root ./www/full/blog;
        index index.html;
        allowed_methods GET;
    }

    # Python CGI
    location /cgi-python/ {
        root ./www/full/cgi-python/cgi-bin;
        index index.html;
        cgi_extension .py;
        cgi_path /usr/bin/python3;
        allowed_methods GET POST;
    }

    # Bash CGI
    location /cgi-bash/ {
        root ./www/full/cgi-bash/cgi-bin;
        index index.html;
        cgi_extension .sh;
        cgi_path /bin/bash;
        allowed_methods GET POST;
    }

    # Cookie demo pages and CGI
    location /cookies/ {
        root ./www/full/cookies;
        index index.html;
        allowed_methods GET;
    }

    location /cookies-bin/ {
        root ./www/full/cookies/cgi-bin;
        cgi_extension .py;
        cgi_path /usr/bin/python3;
        allowed_methods GET POST;
    }

    # Upload demo page
    location /uploads/ {
        root ./www/full/uploads;
        index index.html;
        allowed_methods GET;
    }

    # Upload target + retrieval
    location /upload/ {
        root ./www/full/uploads/files;
        allowed_methods GET POST DELETE;
        upload_enable on;
        upload_store ./www/full/uploads/files;
    }
}

# Virtual host demo (multi-server on same socket)
server {
    listen 127.0.0.1:8080;
    server_name beta.localhost;

    location / {
        root ./www/full/beta;
        index index.html;
        allowed_methods GET;
    }
}
