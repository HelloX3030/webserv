<!doctype html>
<html lang="en" class="theme-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delete Post</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/light.css" />
    <link rel="stylesheet" href="/css/dark.css" />
    <script src="/js/theme.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <a href="/">Full Blog</a>
        <p>Delete a post by filename</p>
      </div>
      <nav class="site-nav">
        <a href="/">Home</a>
        <a href="/create.html">Create Post</a>
        <a href="/posts.html">All Posts</a>
        <a href="/delete.html">Delete Post</a>
      </nav>
      <label class="theme-switcher">
        <span>Theme</span>
        <select id="theme-picker" aria-label="Theme picker">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
    </header>

    <main class="shell narrow">
      <section class="card">
        <h1>Delete a post</h1>
        <p>
          Copy a filename from the live post list or the directory listing, then
          submit it here. Deletion is handled by CGI with no permissions.
        </p>
        <form class="stack" method="post" action="/cgi-bin/delete_post.py">
          <label>
            <span>Post filename</span>
            <input name="post" type="text" placeholder="20260407_120000_hello-world.txt" required />
          </label>
          <button class="button danger" type="submit">Delete post</button>
        </form>
      </section>
    </main>
  </body>
</html>
