<!doctype html>
<html lang="en" class="theme-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Post</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/light.css" />
    <link rel="stylesheet" href="/css/dark.css" />
    <script src="/js/theme.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <a href="/">Full Blog</a>
        <p>Create a new post</p>
      </div>
      <nav class="site-nav">
        <a href="/">Home</a>
        <a href="/create.html">Create Post</a>
        <a href="/posts.html">All Posts</a>
        <a href="/delete.html">Delete Post</a>
      </nav>
      <label class="theme-switcher">
        <span>Theme</span>
        <select id="theme-picker" aria-label="Theme picker">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
    </header>

    <main class="shell narrow">
      <section class="card">
        <h1>Create a post</h1>
        <form class="stack" method="post" action="/cgi-bin/create_post.py">
          <label>
            <span>Title</span>
            <input name="title" type="text" maxlength="120" required />
          </label>
          <label>
            <span>Content</span>
            <textarea name="content" rows="12" required></textarea>
          </label>
          <button class="button" type="submit">Publish post</button>
        </form>
      </section>
    </main>
  </body>
</html>
