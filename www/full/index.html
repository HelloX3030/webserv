<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webserv HTTP Tester</title>
</head>
<body>
    <select id="method-select">
        <option value="GET">GET</option>
        <option value="POST">POST</option>
        <option value="DELETE">DELETE</option>
        <option value="PUT">PUT</option>
    </select>
    <input id="url-input" type="text" placeholder="URL">
    <textarea id="headers-input" rows="6" cols="50" placeholder="Content-Type: application/json&#10;X-Test: hello"></textarea>
    <textarea id="body-input" rows="8" cols="50" placeholder="Request body"></textarea>
    <button id="send-btn">Send</button>
    <div id="response-status"></div>
    <pre id="response-headers"></pre>
    <pre id="response-body"></pre>
    <script src="./script.js"></script>
</body>
</html>
