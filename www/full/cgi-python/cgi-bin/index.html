<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Python CGI demo</title>
    <link rel="stylesheet" href="/assets/theme.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero hero-card">
        <div class="badge">python cgi</div>
        <h1 class="title">See the request environment directly.</h1>
        <p class="subtitle">This section shows method, query string, and body through Python CGI.</p>
      </section>

      <section class="grid" style="margin-top:16px;">
        <article class="panel">
          <h2>Inspect GET</h2>
          <div class="row">
            <a class="btn" href="/cgi-python/env.py?demo=1&source=landing">Open env.py</a>
            <a class="btn secondary" href="/cgi-python/env.py?demo=1&source=landing">Repeat request</a>
          </div>
        </article>

        <article class="panel">
          <h2>Inspect POST</h2>
          <pre>curl -X POST --data "hello python" http://127.0.0.1:8080/cgi-python/env.py</pre>
        </article>
      </section>
    </main>
  </body>
</html>
