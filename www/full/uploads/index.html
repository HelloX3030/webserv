<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uploads demo</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; line-height: 1.45; }
      code { background: #f1f3f5; padding: 0.1rem 0.3rem; border-radius: 4px; }
      #status { margin-top: 1rem; }
    </style>
  </head>
  <body>
    <h1>Uploads demo</h1>
    <p>Upload target: <code>/upload/&lt;filename&gt;</code></p>

    <form id="upload-form">
      <input id="file" type="file" required />
      <button type="submit">Upload</button>
    </form>

    <p>After upload, file URL is <code>/upload/&lt;filename&gt;</code>.</p>
    <div id="status" aria-live="polite"></div>

    <script>
      (function () {
        const form = document.getElementById("upload-form");
        const fileInput = document.getElementById("file");
        const status = document.getElementById("status");

        form.addEventListener("submit", async function (event) {
          event.preventDefault();
          const file = fileInput.files && fileInput.files[0];
          if (!file) return;

          const target = "/upload/" + encodeURIComponent(file.name);
          status.textContent = "Uploading " + file.name + " ...";

          try {
            const response = await fetch(target, {
              method: "POST",
              headers: { "Content-Type": "application/octet-stream" },
              body: file
            });
            status.innerHTML = "HTTP " + response.status + " — <a href='" + target + "'>open uploaded file</a>";
          } catch (err) {
            status.textContent = "Upload failed: " + String(err);
          }
        });
      })();
    </script>
  </body>
</html>
