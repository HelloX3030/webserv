<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bash CGI demo</title>
    <link rel="stylesheet" href="/assets/theme.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero hero-card">
        <div class="badge">bash cgi</div>
        <h1 class="title">A shell script can inspect the request too.</h1>
        <p class="subtitle">Same environment, different interpreter.</p>
      </section>

      <section class="grid" style="margin-top:16px;">
        <article class="panel">
          <h2>Open the script</h2>
          <div class="row">
            <a class="btn" href="/cgi-bash/env.sh?demo=1">Run env.sh</a>
            <a class="btn secondary" href="/cgi-bash/env.sh?demo=1">Run again</a>
          </div>
        </article>

        <article class="panel">
          <h2>Try POST</h2>
          <pre>curl -X POST --data "hello bash" http://127.0.0.1:8080/cgi-bash/env.sh</pre>
        </article>
      </section>
    </main>
  </body>
</html>
