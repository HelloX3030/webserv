<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>beta host</title>
		<link rel="stylesheet" href="/assets/theme.css" />
	</head>
	<body>
		<main class="shell">
			<section class="hero hero-card">
				<div class="badge">virtual host</div>
				<h1 class="title">beta.localhost</h1>
				<p class="subtitle">This is the second server block, reached with a different Host header.</p>
			</section>

			<section class="panel" style="margin-top:16px;">
				<h2>How to reach it</h2>
				<pre>curl -H "Host: beta.localhost" http://127.0.0.1:8080/</pre>
				<p class="muted">In a browser, add <code>beta.localhost</code> to <code>/etc/hosts</code> or your local resolver.</p>
				<div class="row">
					<a class="btn" href="/">Back to default host</a>
					<a class="btn secondary" href="/blog/">Open blog</a>
				</div>
			</section>
		</main>
	</body>
</html>
