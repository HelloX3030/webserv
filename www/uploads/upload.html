<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>uploads.conf site</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; line-height: 1.4; }
      form { margin: 1rem 0; padding: 1rem; border: 1px solid #ddd; border-radius: 8px; max-width: 520px; }
      code { background: #f1f3f5; padding: 0.1rem 0.3rem; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>uploads.conf demo</h1>
    <p>This page is served from <code>./www/uploads/upload.html</code>.</p>

    <form method="POST" action="/upload/" enctype="multipart/form-data">
      <label for="file">Choose a file:</label>
      <input id="file" type="file" name="file" required />
      <button type="submit">Upload</button>
    </form>

    <p>After upload, test retrieval with:</p>
    <p><code>GET /upload/&lt;filename&gt;</code></p>
  </body>
</html>
