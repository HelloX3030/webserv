<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>404 Not Found</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 2rem; line-height: 1.4; }

    <h1>404 Not Found</h1>

    <ul>
      <li><a href="/">Back to demo landing page</a></li>
